
<section class="admin-page-header">
    <div>
        <p class="admin-page-kicker">PASSENGERS</p>

        <h1>
            Manage
            <span>passengers.</span>
        </h1>

        <p class="admin-page-description">
            View registered passengers, their booking history and account
            details across the YSpace network.
        </p>
    </div>
</section>


<section class="admin-flight-toolbar">
    <form class="admin-flight-filters" id="users-filter-form">
        <div class="admin-filter-search">
            <label for="user-search">Search</label>
            <input
                type="search"
                id="user-search"
                name="search"
                placeholder="Name, email or role"
            />
        </div>

        <button
            type="submit"
            class="admin-button admin-button-secondary admin-filter-button"
        >
            Search
        </button>
    </form>
</section>


<section class="admin-panel">
    <header class="admin-panel-header">
        <div>
            <p class="admin-panel-kicker">ACCOUNTS</p>
            <h2>All passengers</h2>
        </div>
        <div class="admin-table-result-count" id="users-count">Loading...</div>
    </header>

    <div class="admin-table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Bookings</th>
                    <th>Joined</th>
                </tr>
            </thead>
            <tbody id="users-tbody">
                <tr>
                    <td colspan="6" class="admin-table-empty">Loading passengers...</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
