
<section class="admin-page-header">

        <h1>
            Manage
            <span>spacecraft.</span>
        </h1>

        <p class="admin-page-description">
            View the YSpace fleet, including operational status, capacity
            and model details for each spacecraft.
        </p>

</section>

            </thead>
            <tbody id="spacecraft-tbody">

                    <td colspan="7" class="admin-table-empty">Loading spacecraft...</td>

            </tbody>
        </table>
